name: Weekly scale revalidation

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Run 3-pair scale experiment
        run: bun run scale 2>&1 | tee scale-output.txt
      - name: Upload scale output
        uses: actions/upload-artifact@v4
        with:
          name: scale-output-weekly
          path: scale-output.txt
          if-no-files-found: error
      - id: previous
        name: Fetch previous run's scale output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREV_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=scale-output-weekly&per_page=100" \
            --jq "[.artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID})] | sort_by(.created_at) | reverse | .[0].id // empty")
          if [ -z "$PREV_ID" ]; then
            echo "No previous weekly artifact — first run establishes the baseline."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            URL=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREV_ID}" --jq '.archive_download_url')
            curl -sSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$URL" -o prev-scale.zip
            unzip -q prev-scale.zip -d prev-scale
            echo "Fetched previous weekly artifact ${PREV_ID}."
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check human-vs-AI direction vs previous run
        if: steps.previous.outputs.found == 'true'
        run: bun run experiment/drift.ts scale-output.txt prev-scale/scale-output.txt

  probe-red-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      checks: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Prove red gates still block the merge
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run experiment/probe-red-gates.ts
