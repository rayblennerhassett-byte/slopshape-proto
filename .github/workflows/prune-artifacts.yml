name: Artifact pruner

on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC, after the weekly revalidation
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Delete non-weekly scale-output artifacts older than 30 days
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run experiment/prune-artifacts.ts
