name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pair:
        description: Sample pair to run the scale experiment over
        type: choice
        default: all
        required: true
        options:
          - all
          - shipped
          - bakery
          - library

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test ./test
      - run: bun run demo
      - run: bun run detect samples/human-post.md
      - run: bun run detect samples/ai-post.md
      - name: Run scale experiment
        run: |
          pair="${{ inputs.pair }}"
          if [ -z "$pair" ] || [ "$pair" = "all" ]; then
            bun run scale
          else
            bun run scale "$pair"
          fi
