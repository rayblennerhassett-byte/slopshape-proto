name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pair:
        description: Sample pair to run the scale experiment over
        type: choice
        default: all
        required: true
        options:
          - all
          - shipped
          - bakery
          - library

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Verify probe-PR citations in docs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run experiment/verify-citations.ts
      - name: Lint PR title (conventional commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun run lint-pr-title.ts
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test ./test
      - run: bun run demo
      - run: bun run detect samples/human-post.md
      - run: bun run detect samples/ai-post.md
      - name: Run scale experiment
        run: |
          pair="${{ inputs.pair }}"
          if [ -z "$pair" ] || [ "$pair" = "all" ]; then
            bun run scale 2>&1 | tee scale-output.txt
          else
            bun run scale "$pair" 2>&1 | tee scale-output.txt
          fi
      - name: Upload scale experiment output
        uses: actions/upload-artifact@v4
        with:
          name: scale-output${{ inputs.pair != '' && format('-{0}', inputs.pair) || '' }}
          path: scale-output.txt
          if-no-files-found: error
